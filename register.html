<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนผู้มาติดต่อ - RMT Visitor Check-in</title>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
 body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0097B2; /* 🌈 เปลี่ยนพื้นหลังหลัก */
  min-height: 100vh;
  padding: 20px;
  color: #333;
  line-height: 1.6;
}
  .header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 999;
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(10px);
  width: 100%;
  max-width: none;
  padding: 20px 0;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  border-radius: 0 0 20px 20px;
}
.container {
  width: 100%;
  max-width: 650px;
  margin: 60px auto 0; /* เพิ่มระยะจาก header */
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  position: relative;
  overflow: hidden;
}

    .logo-section{margin-bottom:15px}
    .company-name {
  font-size: 22px;
  font-weight: 700;
  color: #2c5282;
  letter-spacing: .5px;
  text-transform: uppercase;
}
    .system-title{font-size:14px;color:#4a5568;font-weight:500;text-transform:uppercase;letter-spacing:1px}
    
    .container::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2c5282,#3182ce,#4299e1)}
    .main-title{text-align:center;color:#2c5282;margin-bottom:30px;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
    .form-section{background:#f8fafc;padding:25px;border-radius:15px;margin-bottom:25px;border:1px solid #e2e8f0}
    .section-title{font-size:16px;font-weight:600;color:#2d3748;margin-bottom:20px;display:flex;align-items:center;gap:8px}
    .form-group{margin-bottom:20px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
    label{display:block;margin-bottom:8px;font-weight:600;font-size:14px;color:#2d3748}
    .required{color:#e53e3e}
    input,select{
      width:100%;padding:12px 16px;border-radius:10px;border:2px solid #e2e8f0;
      font-size:15px;transition:all .3s.ease;background:#fff
    }
    input:focus,select:focus{outline:none;border-color:#3182ce;box-shadow:0 0 0 3px rgba(49,130,206,.1)}
    input:invalid{border-color:#fc8181}
    .row-inline{display:flex;align-items:center;gap:10px}
    .muted{font-size:13px;color:#4a5568}
    .total-pill{padding:8px 12px;border-radius:999px;background:#e6fffa;border:1px solid #81e6d9;color:#285e61;font-weight:700}
    .submit-button{
      width:100%;padding:16px 24px;font-size:16px;font-weight:600;
      background:linear-gradient(135deg,#2c5282 0%,#3182ce 100%);
      color:#fff;border:none;border-radius:12px;cursor:pointer;transition:all .3s ease;
      box-shadow:0 4px 15px rgba(44,82,130,.3);margin-top:10px;letter-spacing:.3px
    }
    .submit-button:hover{background:linear-gradient(135deg,#2a4c80 0%,#2c7cb8 100%);transform:translateY(-2px);box-shadow:0 6px 20px rgba(44,82,130,.4)}
    .submit-button:active{transform:translateY(0)}
    .btn-secondary{
      width:100%;padding:12px 20px;font-size:15px;font-weight:600;background:#edf2f7;color:#2d3748;
      border:none;border-radius:10px;cursor:pointer;transition:.2s; margin-top:10px
    }
    .btn-secondary:hover{background:#e2e8f0}
    .back-button {
  position: fixed;
  bottom: 20px;  /* ✅ ย้ายไปล่างซ้าย */
  left: 20px;
  background: rgba(255, 255, 255, .9);
  backdrop-filter: blur(10px);
  border: none;
  padding: 12px 16px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: #2c5282;
  transition: all .3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);
  z-index: 1000;
}
.back-button:hover {
  background: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
}

    .loading{display:inline-block;width:20px;height:20px;border:2px solid #fff;border-radius:50%;border-top-color:transparent;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

/* 📱 ปรับความสูง input/select ให้เท่ากันในมือถือ */
@media (max-width: 768px) {
  input, select {
    height: 48px;
    line-height: 48px;
  }
  .row-inline {
    align-items: center;
  }
  #followers {
    flex: 1;
  }
  #totalPeople {
    flex-shrink: 0;
    white-space: nowrap;
  }
}
.company-logo {
  display: block;
  margin: 10px auto 0; /* เว้นห่างเล็กน้อยจากข้อความ */
  width: 80px;         /* ปรับขนาดโลโก้พอดี */
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
}

  </style>
</head>
<body>
  <button class="back-button" onclick="history.back()">← กลับ</button>

<div class="header">
  <div class="logo-section">
    <div class="company-name">RMT Visitor Track System</div>
    <img src="logo.png" alt="Company Logo" class="company-logo">
  </div>
</div>



  <div class="container">
    <h2 class="main-title">📋 ลงทะเบียนผู้มาติดต่อ</h2>

    <form id="visitorForm" autocomplete="off">
      <div class="form-section">
        <div class="section-title">👤 ข้อมูลส่วนตัว</div>

        <div class="form-group">
          <label for="fullName">ชื่อ-นามสกุล <span class="required">*</span></label>
          <input type="text" id="fullName" placeholder="กรอกชื่อ-นามสกุลของท่าน" required minlength="2" maxlength="120">
        </div>

 <div class="form-group">
  <label for="phone">เบอร์โทรศัพท์ <span class="required">*</span></label>
  <input 
    type="tel" 
    id="phone" 
    placeholder="กรอกเฉพาะตัวเลข 9–10 หลัก" 
    pattern="[0-9]{9,10}" 
    required 
    maxlength="10" 
    inputmode="numeric"
    oninput="this.value=this.value.replace(/[^0-9]/g,'');">
</div>

<div class="form-group">
  <label for="company">บริษัทต้นสังกัด <span class="required">*</span></label>
  <input type="text" id="company" placeholder="กรอกชื่อบริษัทหรือหน่วยงาน" required minlength="2" maxlength="120">
</div>

<div class="form-row">
  <div class="form-group">
    <label for="carPlate">ทะเบียนรถ <span class="required">*</span></label>
    <input type="text" id="carPlate" placeholder="เช่น กก 1234 / ABC 1234" inputmode="text" maxlength="12" required>
  </div>



 <div class="form-group">
  <label for="followers">จำนวนผู้ติดตาม</label>
  <select id="followers">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9">9</option>
    <option value="10">10</option>
  </select>

  <!-- รวมทั้งหมด -->
  <div style="margin-top:10px; display:block; color:#2d3748;">
    <div style="font-weight:600; margin-bottom:6px;">รวมทั้งหมด:</div>
    <div 
      id="totalPeople" 
      class="total-pill"
      style="display:flex; align-items:center; justify-content:center; width:100%; height:48px; font-size:15px;">
      1 คน
    </div>
  </div>
</div>


        </div>
      </div>

      <div class="form-section">
        <div class="section-title">🎯 วัตถุประสงค์การเยี่ยมชม</div>

        <div class="form-row">
          <div class="form-group">
            <label for="purpose">วัตถุประสงค์ <span class="required">*</span></label>
            <select id="purpose" required>
              <option value="">-- กรุณาเลือก --</option>
              <option value="ติดต่องาน">ติดต่องาน</option>
              <option value="รับ/ส่งเอกสาร">รับ/ส่งเอกสาร</option>
              <option value="รับ/ส่งสินค้า">รับ/ส่งสินค้า</option>
              <option value="สมัครงาน">สมัครงาน</option>
              <option value="อื่น ๆ">อื่น ๆ</option>
            </select>
          </div>

          <div class="form-group" id="purposeOtherGroup" style="display:none">
            <label for="purposeOther">ระบุวัตถุประสงค์ (ถ้าเลือกอื่น ๆ) <span class="required">*</span></label>
            <input type="text" id="purposeOther" placeholder="ระบุวัตถุประสงค์เพิ่มเติม" maxlength="120">
          </div>

          <div class="form-group">
            <label for="department">แผนกที่ติดต่อ <span class="required">*</span></label>
            <select id="department" required>
              <option value="">-- กรุณาเลือก --</option>
              <option value="PD">PD</option>
              <option value="PC">PC</option>
              <option value="PE/Tooling">PE/Tooling</option>
              <option value="QA/QC">QA/QC</option>
              <option value="Design">Design</option>
              <option value="ซ่อมบำรุง">ซ่อมบำรุง</option>
              <option value="จัดซื้อ">จัดซื้อ</option>
              <option value="บุคคล">บุคคล</option>
              <option value="บัญชี">บัญชี</option>
              <option value="Safty">Safety</option>
              <option value="IT">IT</option>
              <option value="ร้านค้า">ร้านค้า</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="contactPerson">ชื่อบุคคลที่เข้าพบ <span class="required">*</span></label>
          <input type="text" id="contactPerson" placeholder="กรอกชื่อผู้ที่ต้องการเข้าพบ" required minlength="2" maxlength="120">
        </div>
      </div>

      <button type="submit" class="submit-button" id="submitBtn">✅ สร้าง QR Code</button>
      <button type="button" class="btn-secondary" id="resetBtn">ล้างฟอร์ม</button>
    </form>
  </div>

  <script>
    const $ = s=>document.querySelector(s);
    const $$ = s=>document.querySelectorAll(s);

    function formatCarPlate(val){
      return val.toUpperCase().replace(/\s+/g,' ').trim();
    }

    function calcTotal(){
      const followers = parseInt($('#followers').value || '0',10);
      $('#totalPeople').textContent = `${1+followers} คน`;
    }

    function getFormData(){
      const purposeValue = $('#purpose').value === 'อื่น ๆ'
        ? ($('#purposeOther').value.trim() || 'อื่น ๆ')
        : $('#purpose').value;

      return {
        fullName: $('#fullName').value.trim(),
        phone: $('#phone').value.trim(),
        company: $('#company').value.trim(),
        carPlate: $('#carPlate').value.trim(),
        followers: $('#followers').value,
        purpose: purposeValue,
        contactPerson: $('#contactPerson').value.trim(),
        department: $('#department').value,
        total: 1 + parseInt($('#followers').value || '0',10),
        ts: new Date().toISOString()
      };
    }

    function setLoading(isLoading){
      const btn = $('#submitBtn');
      if(isLoading){
        btn.innerHTML = '<span class="loading"></span> กำลังสร้าง QR Code...';
        btn.disabled = true;
      }else{
        btn.innerHTML = '✅ สร้าง QR Code ใหม่';
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      $('#followers').addEventListener('change', calcTotal);
      calcTotal();
      $('#purpose').addEventListener('change', ()=>{$('#purposeOtherGroup').style.display=$('#purpose').value==='อื่น ๆ'?'':'none';});
      $('#carPlate').addEventListener('input', e=>{
        const pos = e.target.selectionStart;
        e.target.value = formatCarPlate(e.target.value);
        e.target.setSelectionRange(pos, pos);
      });
    });

    $('#resetBtn').addEventListener('click', ()=>{
      $('#visitorForm').reset();
      $('#purposeOtherGroup').style.display='none';
      $('#totalPeople').textContent='1 คน';
    });

    let submitting = false;
    $('#visitorForm').addEventListener('submit', e=>{
      e.preventDefault();
      if(submitting) return;
      const data = getFormData();

      if(!data.fullName || !data.phone || !data.company || !data.contactPerson || !data.department || !data.purpose)
        return Swal.fire({icon:'warning',title:'กรอกข้อมูลไม่ครบ',text:'กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน'});
      if($('#purpose').value==='อื่น ๆ' && !$('#purposeOther').value.trim())
        return Swal.fire({icon:'warning',title:'กรุณาระบุวัตถุประสงค์',text:'กรุณากรอกคำอธิบายสำหรับ “อื่น ๆ”'});

      submitting = true;
      setLoading(true);
      setTimeout(()=>{
        try{
          const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(data));
          const wrap = document.createElement('div');
          wrap.innerHTML = `
            <div id="qr-code-container" style="display:flex;justify-content:center"></div>
            <div style="font-size:13px;margin-top:12px;color:red;background:#fff;padding:12px">
              📸 โปรดยื่นหน้าจอนี้ให้เจ้าหน้าที่รักษาความปลอดภัย
            </div>`;
          new QRCode(wrap.querySelector('#qr-code-container'),{text:compressed,width:280,height:280,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});
          Swal.fire({title:'QR Code ของคุณ',html:wrap,width:360,confirmButtonText:'ปิด'});
        }catch(err){
          console.error(err);
          Swal.fire({icon:'error',title:'เกิดข้อผิดพลาด',text:'ไม่สามารถสร้าง QR Code ได้'});
        }finally{
          submitting=false;
          setLoading(false);
        }
      },500);
    });
  </script>
</body>
</html>
